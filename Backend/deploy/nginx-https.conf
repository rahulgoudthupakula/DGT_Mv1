server {
    listen 80;
    server_name dgttechnologies.com www.dgttechnologies.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://dgttechnologies.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name dgttechnologies.com;
    ssl_certificate /etc/letsencrypt/live/dgttechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgttechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/dgt/current/frontend;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# BEGIN WWW REDIRECT
server {
    listen 443 ssl;
    server_name www.dgttechnologies.com;
    ssl_certificate /etc/letsencrypt/live/dgttechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgttechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://dgttechnologies.com$request_uri;
}
# END WWW REDIRECT
