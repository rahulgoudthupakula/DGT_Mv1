spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: dgt-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dgt}
    username: ${DB_USERNAME:dgt}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-version: 1
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_HOLD
  jackson:
    property-naming-strategy: SNAKE_CASE
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  receipt-reader:
    api-key: ${LOVABLE_API_KEY:}
    model: ${RECEIPT_READER_MODEL:google/gemini-3.7-flash}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  access:
    administrator-emails: ${SCHEMA_ADMIN_EMAILS:}
  jwt:
    secret: ${JWT_SECRET:changeme-replace-in-production-must-be-at-least-256-bits-base64}
    expiration-seconds: ${JWT_EXPIRATION:28800}
    refresh-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION:2592000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
