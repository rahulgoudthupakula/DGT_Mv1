services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dgt
      POSTGRES_USER: dgt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dgt-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgt -d dgt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dgt-data:
